# Custom semgrep rules for defect classes no off-the-shelf ruff/eslint code
# covers.
#
# PROVENANCE: these rules were authored from a review audit of 8,563 pull
# requests across 23 repositories — they are a STARTER SET, not a standard.
# Replace any of them. The engine does not care what the rules say; it cares
# that each one has a fixture proving it still matches.
#
# MANDATORY BEFORE ENABLING ANY RULE:
#   1. Write fixtures with `# ruleid: <id>` and `# ok: <id>` annotations in
#      rules/semgrep/targets/.
#   2. `semgrep --test --config rules/semgrep/rules/ rules/semgrep/targets/`
#   3. Ship at WARNING for two weeks, collect the exception set, then promote
#      to ERROR.
#
# A rule with no fixture is a silent false negative waiting for a refactor:
# a rule that stops matching reports PASS forever, which is indistinguishable
# from compliance. That is the single failure mode this whole tool exists to
# remove, so the fixtures are not optional.
#
# RATCHET: do not scan the whole tree and hope. The gate runs:
#   semgrep scan --config rules/semgrep/rules/ \
#     --baseline-commit "$(git merge-base origin/main HEAD)" --error
# This requires actions/checkout with fetch-depth: 0 and a clean worktree at
# that point in the pipeline (semgrep aborts on unstaged changes). A shallow
# clone has no merge-base, which semgrep scores as "no new findings" and
# PASSES — a green check that measured nothing.
#
# PATH COVERAGE: every `paths:` block below is an explicit decision. Getting
# it wrong is measurable and was measured: after convention gates landed in
# the audited org, function-local imports fell 155 -> 21 on production paths
# and ROSE to 49 on test paths; hasattr/getattr fell 44 -> 8 in production and
# rose 1 -> 14 in tests. Excluding tests does not remove the violations, it
# relocates them. There is no test-file exclusion here except where tests are
# the explicit target.

rules:
- id: ratchet-gha-untrusted-checkout-with-secrets
  languages:
  - generic
  severity: ERROR
  message: 'A workflow triggered by `pull_request_target` (or `workflow_run`) that checks out the PR head
    ref executes untrusted code with the base repo''s secrets. Measured three times in the audit: PR-controlled
    workload submission; PR code replacing a deployment manifest so an installation token becomes a
    workflow output; a mutable CLI receiving deploy credentials. All three
    merged with the thread unresolved. Check out the base ref, or move the privileged step to a separate
    workflow that never checks out PR code.'
  metadata:
    category: SECURITY M7, tier S1
    measured-findings: 19
    shipped-unresolved: true
    phase: 0
    validate: "FIXTURES REQUIRED \u2014 this regex pair is file-scoped, not step-scoped, so it will flag\
      \ a workflow where the two constructs are unrelated. Tighten with a per-job check before promoting\
      \ to ERROR."
  patterns:
  - pattern-regex: (?s)(pull_request_target|workflow_run).*?uses:\s*actions/checkout@.*?ref:\s*\$\{\{\s*github\.event\.pull_request\.head
  paths:
    include:
    - '**/.github/workflows/*.yml'
    - '**/.github/workflows/*.yaml'
