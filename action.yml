name: Ratchet Gates
description: >-
  Ratcheted deterministic code-quality gates. Findings are filtered to the
  lines the pull request ADDED, so legacy violations never block adoption and
  no suppression sweep is needed. Mark this check required in the branch
  ruleset to turn it from a notification into a gate.
author: andrewlau624
branding:
  icon: shield
  color: blue

inputs:
  base:
    description: >-
      Base commit for the ratchet. Defaults to the merge-base with the default
      branch, which is correct for normal pull requests. Override only for
      unusual branch topology.
    required: false
    default: ""
  ruff-codes:
    description: >-
      The full ruff code set the gate selects, REPLACING the bundled default
      (PLC0415, TRY400, UP, TID251, ASYNC, RUF006, RUF100, PGH003, PGH004).
      These are added to the repo's own ruff config via `lint.extend-select`,
      so the repo's existing ignores and exclusions are preserved.
    required: false
    default: ""
  semgrep-severity:
    description: "Semgrep severity gate (ERROR / WARNING). Default ERROR."
    required: false
    default: "ERROR"
  comment:
    description: >-
      Post (and keep updating) one sticky comment on the pull request with the
      gate result. Needs `pull-requests: write`. Set "false" for log-only.
    required: false
    default: "true"
  advisory:
    description: >-
      Run every gate and report findings without failing the job. This is how
      to adopt before making the check required. Do NOT use semgrep-severity
      for this — it filters which rules report at all, so WARNING hides every
      rule that declares ERROR rather than demoting it.
    required: false
    default: "false"
  profile:
    description: >-
      Named profile to start from (`default`, `minimal`). The repository's
      own .ratchet-gates.toml, if present, is layered on top of it and wins.
      There is deliberately no input for pointing at a different config FILE:
      the policy a pull request is judged against should be visible in the
      repository being judged.
    required: false
    default: ""

outputs:
  report:
    description: "Path to the machine-readable run record (JSON)"
    value: ${{ steps.gates.outputs.report }}
  result:
    description: "CLEAN | NEW_VIOLATIONS | TOOLING_FAILURE"
    value: ${{ steps.gates.outputs.result }}
  summary:
    description: "Human-readable gate summary (the full gate log)"
    value: ${{ steps.gates.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Install gate toolchain
      shell: bash
      run: pip install --quiet ruff semgrep

    # Runs the gates and always exits 0, so the outputs below are reliably
    # published. The verdict is enforced by the next step.
    - name: Run gates
      id: gates
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        PROFILE: ${{ inputs.profile }}
        ADVISORY: ${{ inputs.advisory }}
        RUFF_CODES_INPUT: ${{ inputs.ruff-codes }}
      run: |
        # Export only when non-empty. Exporting an empty value would shadow the
        # CLI's default code set, and an empty extend-select selects nothing.
        if [ -n "$RUFF_CODES_INPUT" ]; then
          export RATCHET_GATES_RUFF_CODES="$RUFF_CODES_INPUT"
        fi
        set +e
        out="$(PYTHONPATH="${{ github.action_path }}/src" python3 -m ratchet_gates \
          --repo "${{ github.workspace }}" \
          ${BASE:+--base "$BASE"} \
          ${PROFILE:+--profile "$PROFILE"} \
          $([ "$ADVISORY" = "true" ] && echo --advisory) \
          --json-out "$RUNNER_TEMP/ratchet-gates-run.json" \
          --semgrep-severity "${{ inputs.semgrep-severity }}" 2>&1)"
        rc=$?
        set -e
        printf '%s\n' "$out"
        case "$rc" in
          0) result=CLEAN ;;
          2) result=NEW_VIOLATIONS ;;
          *) result=TOOLING_FAILURE ;;
        esac
        {
          echo "result=$result"
          echo "exit-code=$rc"
          echo "report=$RUNNER_TEMP/ratchet-gates-run.json"
          echo "summary<<RATCHET_GATES_SUMMARY_EOF"
          printf '%s\n' "$out"
          echo "RATCHET_GATES_SUMMARY_EOF"
        } >> "$GITHUB_OUTPUT"

    # Renders from the run record, so the summary and the comment cannot
    # disagree with the log about what was found.
    - name: Job summary
      if: always()
      shell: bash
      run: |
        report="$RUNNER_TEMP/ratchet-gates-run.json"
        [ -f "$report" ] || exit 0
        PYTHONPATH="${{ github.action_path }}/src" python3 -m ratchet_gates \
          report "$report" --one >> "$GITHUB_STEP_SUMMARY"

    - name: Upload run record
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ratchet-gates-run-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ratchet-gates-run.json
        if-no-files-found: ignore
        retention-days: 90

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        report="$RUNNER_TEMP/ratchet-gates-run.json"
        [ -f "$report" ] || exit 0
        marker="<!-- ratchet-gates -->"
        body="$(PYTHONPATH="${{ github.action_path }}/src" python3 -m ratchet_gates \
          report "$report" --one)"
        printf '%s\n\n%s\n' "$marker" "$body" > "$RUNNER_TEMP/comment.md"

        # One sticky comment, updated in place. A new comment per push turns
        # the gate into noise people mute, which is the same outcome as a
        # gate that does not run.
        existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"$marker\")) | .id] | first // empty")"
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
            -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
        fi

    - name: Enforce gate verdict
      shell: bash
      env:
        RESULT: ${{ steps.gates.outputs.result }}
        RC: ${{ steps.gates.outputs.exit-code }}
      run: |
        case "$RESULT" in
          CLEAN)
            echo "::notice title=ratchet-gates::CLEAN — no new violations on changed lines"
            ;;
          NEW_VIOLATIONS)
            echo "::error title=ratchet-gates::NEW_VIOLATIONS — see the gate log above"
            exit "$RC"
            ;;
          *)
            echo "::error title=ratchet-gates::TOOLING_FAILURE — a required gate tool is missing or crashed. A tool that cannot run is a failure, not a pass."
            exit "$RC"
            ;;
        esac
